[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observed-detail-video-restoration"
version = "0.1.0"
description = "CPU-first falsifiable temporal detail memory with Sihti-null controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
]

[tool.setuptools.packages.find]
include = ["videorestoration*"]
