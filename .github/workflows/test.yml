name: Test and benchmark CPU gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Unit and integration gates
        run: python -m unittest discover -s tests -v
      - name: Frozen procedural evaluation (not trained or cherry-picked)
        run: python -m videorestoration benchmark --out runs/ci-gate1
      - name: Upload falsifiable receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-gate1-cpu
          path: runs/ci-gate1/
          if-no-files-found: warn
